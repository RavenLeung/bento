name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like and any alternatives you considered.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Customer builder
        - Checkout and payments
        - Order tracking
        - Staff tools
        - Square integration
        - Deployment and operations
        - Documentation
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links or examples are welcome. Do not include credentials or customer data.
