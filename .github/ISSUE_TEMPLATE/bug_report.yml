name: Bug report
description: Report a reproducible problem with the app
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove secrets, customer data and private order tokens from logs before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior and the impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm run dev`
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Running mode
      options:
        - Local demo (no database)
        - Local with PostgreSQL / Square sandbox
        - Showcase mode
        - Production
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: e.g. a95c820
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only the relevant error output. Remove secrets and personal data.
      render: shell
