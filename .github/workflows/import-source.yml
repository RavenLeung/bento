name: Import source

on:
  push:
    paths:
      - .import/READY

permissions:
  contents: write

jobs:
  import-source:
    if: github.event.head_commit.message == 'Import source bundle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .import/part-* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          echo "7e50048355e64f0ad76f7c7bedfb4d7ca8aee124e45d7f03a17fa24f0663fa4a  /tmp/source.tar.xz" | sha256sum -c -
          mkdir -p /tmp/source
          tar -xJf /tmp/source.tar.xz -C /tmp/source
          rsync -a --exclude='.git' /tmp/source/ ./
          rm -rf .import
      - name: Generate lockfile
        shell: bash
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Bento Lab source [skip ci]"
          git push
