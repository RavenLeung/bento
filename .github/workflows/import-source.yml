name: Import source

on:
  push:
    paths:
      - .import/READY

permissions:
  contents: write

jobs:
  import-source:
    if: github.event.head_commit.message == 'Import source bundle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .import/part-* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.gz
          echo "16bcb6a994be0448cc764edc28b0957460f600ca35f4f0fba56d30308bee7ecd  /tmp/source.tar.gz" | sha256sum -c -
          mkdir -p /tmp/source
          tar -xzf /tmp/source.tar.gz -C /tmp/source
          rsync -a --exclude='.git' /tmp/source/source/ ./
          rm -rf .import
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Bento Lab source [skip ci]"
          git push
